# ===================================================================
# QuickServ Backend Configuration
#
# By default this runs against an in-memory H2 database so the API
# starts with zero setup. To use MySQL instead, comment out the H2
# block and uncomment the MySQL block below (and add the mysql
# dependency in pom.xml).
# ===================================================================

server.port=7070

# ---------- H2 (default, in-memory) ----------
spring.datasource.url=jdbc:h2:mem:quickservdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- MySQL (uncomment to use) ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/quickservdb?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS-allowed frontend origin (must match SecurityConfig.java)
app.cors.allowed-origin=http://localhost:3000
